[package]
name = "nexustask"
version = "2.0.0"
edition = "2021"
description = "Enterprise Task Management System with Hexagonal Architecture"

[lib]
name = "nexustask"
path = "src/lib.rs"

[[bin]]
name = "nexustask"
path = "src/main.rs"

[dependencies]
# GUI
egui = "0.27"
eframe = "0.27"
egui_plot = "0.27"

# Web/API
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
utoipa = { version = "4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "4.0", features = ["axum"] }

# Database
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Async
tokio = { version = "1.0", features = ["full"] }
tokio-cron-scheduler = "0.10"

# Security
argon2 = "0.5"
jsonwebtoken = "9.0"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
zstd = "0.13"
log = "0.4"
env_logger = "0.11"
cron = "0.12"

# HTTP & Webhooks
reqwest = { version = "0.11", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
